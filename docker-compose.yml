services:
  bot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tdlight-bot-api
    restart: unless-stopped
    ports:
      - "8081:8081"
      - "8082:8082"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
      # Nao tem rota HTTP /file/ nessa versao - servidor so aceita prefixo /bot, /user, /userlogin.
      # --local fica ligado de proposito: sem ganho nenhum em desligar (sem HTTP download mesmo assim),
      # so perderia o beneficio de arquivo sem limite de 20MB. Acesso a midia e via filesystem (ver chat).
      TELEGRAM_LOCAL: 1
      TELEGRAM_STAT: ${TELEGRAM_STAT:-1}
      TELEGRAM_VERBOSITY: ${TELEGRAM_VERBOSITY:-2}
      TELEGRAM_ALLOW_USERS: ${TELEGRAM_ALLOW_USERS:-1}
    volumes:
      - botdata:/var/lib/telegram-bot-api

  file-server:
    image: python:3.12-alpine
    container_name: tdlight-file-server
    restart: unless-stopped
    ports:
      - "8084:80"
    environment:
      DELETE_AFTER_SERVE: "1"
    volumes:
      - botdata:/data
      - ./file-server.py:/app/file-server.py:ro
    command: python /app/file-server.py

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: tdlight-swagger-ui
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SWAGGER_JSON: /spec/tdlight-api-openapi.yaml
    volumes:
      - ./tdlight-api-openapi.yaml:/spec/tdlight-api-openapi.yaml:ro

volumes:
  botdata: